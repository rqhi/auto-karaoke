# Skoda Enyaq, 13" landscape display (MY2027), measured from photos of the car.
# The car keeps its own columns left and right (climate, home, clock), so Android
# Auto gets a ~1560x880 area of the ~1920x1080 panel: launcher bar at the bottom,
# Maps and a narrow media card side by side, opened apps fill the area.
# dpi 280 gives the car's layout; at 160-200 the launcher moves to a left rail.
[general]
touch = true
touchpad = false
controller = false
instrumentcluster = false
playbackstatus = true
resolution = 1920x1080
marginwidth = 360
marginheight = 200
dpi = 280
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
